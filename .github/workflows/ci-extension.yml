name: CI — Extension

on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @copilot/shared-types build

      - name: Lint
        run: pnpm --filter @copilot/extension lint

      - name: Type check
        run: pnpm --filter @copilot/extension type-check

      - name: Build
        run: pnpm --filter @copilot/extension build
