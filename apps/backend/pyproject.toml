[project]
name = "copilot-backend"
version = "0.1.0"
description = "InterviewPilot Backend — FastAPI"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "authlib>=1.4.0",
    "httpx>=0.28.0",

    # Orchestration (pinned exactly: checkpoint format and serde behavior are version-sensitive)
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",

    # LLM Providers
    "anthropic>=0.42.0",
    "openai>=1.60.0",

    # Document parsing
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.0",

    # Storage
    "boto3>=1.36.0",

    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "prometheus-client>=0.21.0",

    # Config
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
]
# Local development only: DEV_LLM_PROVIDER=claude_code (ships its own ~250 MB CLI).
claude-code = [
    "claude-agent-sdk>=0.2.168",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    # FastAPI-idiomatic ``param: X = Depends(dep)`` fires B008; reverting
    # would break the DI wiring.
    "B008",
    # ``str, Enum`` vs ``StrEnum`` — tracked for a follow-up migration.
    "UP042",
    # PEP 695 generic syntax is a nice-to-have cascade, not gated here.
    "UP046",
    "UP047",
    # Long LLM prompt strings are embedded in source; black-style reflow
    # hurts readability more than it helps.
    "E501",
    # Some SQLAlchemy ORM / business fields genuinely use ``id``.
    "A001",
    "A002",
    # Dashboard handlers use single-letter loop vars to mirror DB columns;
    # not worth fighting the convention.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Tests may intentionally raise broad exceptions to assert graceful
# handling paths on the code under test.
"tests/**" = ["B017"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Full ``strict`` flags too many legacy annotations in this codebase to
# fix in one pass. We keep the meaningful subset and plan to tighten over
# time. Reverting to strict is a one-line change once the backlog clears.
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
no_implicit_optional = true
ignore_missing_imports = true
