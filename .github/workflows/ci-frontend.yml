name: CI — Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @copilot/shared-types build && pnpm --filter @copilot/sdk build

      - name: Lint
        run: pnpm --filter @copilot/frontend lint

      - name: Type check
        run: pnpm --filter @copilot/frontend type-check

      - name: Test
        run: pnpm --filter @copilot/frontend test

      - name: Build
        run: pnpm --filter @copilot/frontend build
